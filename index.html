<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Park Builder</title>
<style>
  body { margin: 0; background: #1b1d3a; color: #fff; font: 15px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  #hud { font-weight: 600; white-space: pre; }
  #tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  button { background: #2e3163; color: #fff; border: 2px solid transparent; border-radius: 10px; padding: 6px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font: inherit; font-size: 13px; min-width: 64px; }
  button span { font-size: 22px; }
  button small { opacity: .7; }
  button[aria-pressed="true"] { border-color: #ffd166; background: #44478a; }
  button:focus-visible { outline: 2px solid #fff; }
  canvas { width: 100%; max-width: 960px; border-radius: 12px; touch-action: none; box-shadow: 0 8px 30px #0008; }
  #toast { position: fixed; top: 16px; background: #e63946; padding: 8px 14px; border-radius: 8px; }
  p { margin: 0; opacity: .7; font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <h1>✨ Dream Park Builder</h1>
  <div id="hud" aria-live="polite"></div>
  <div id="tools" role="toolbar" aria-label="Build tools"></div>
  <canvas id="park" aria-label="Your park. Click or drag to build."></canvas>
  <p>Lay paths from the 🎟️ gate, build rides next to them, and guests will come. Build a castle for fireworks at night. Keys 1-9 pick tools.</p>
  <div id="toast" hidden></div>
  <script src="game.js"></script>
</body>
</html>
